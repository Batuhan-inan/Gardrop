<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gardırop & Kombin - Akıllı Dolap Asistanı</title>
  <meta name="description" content="Kıyafetlerini kategorize et, fotoğraflarını yükle, dolapta unutulanları keşfet ve akıllı filtreleme ile harika kombinler oluştur.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/images/placeholder.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Dinamik Uygulama Kapsayıcısı -->
  <div id="app-root">
    <!-- Yükleniyor Göstergesi -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; color: var(--text-secondary);">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(212,175,55,0.2); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="font-size: 0.9rem; letter-spacing: 1px;">GARDIROP YÜKLENİYOR...</p>
    </div>
  </div>

  <!-- Toast Bildirim Alanı -->
  <div id="toast-container" class="toast-container"></div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- App JavaScript (v=2 cache buster) -->
  <script src="/js/app.js?v=2"></script>
</body>
</html>
